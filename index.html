<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>ダンジョン・サバイバー</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:5;text-align:center;padding:20px;box-sizing:border-box}
.ov.on{display:flex;pointer-events:auto}.ov{pointer-events:none}.ov:not(.on){display:none!important}
button{font-size:18px;margin:6px;padding:12px 24px;border:3px solid #fff;background:#3a2a5a;color:#fff;border-radius:6px;font-weight:bold;min-width:220px}

</style></head><body>
<canvas id="c"></canvas>
<button id="pause">⏸</button>
<div class="ov on" id="title"><h1>ダンジョン<br>サバイバー</h1><p>迫りくる魔物をなぎ倒し、<br>ダンジョンの奥深くへ！</p>
<button id="bNew">はじめから</button><button id="bCont">つづきから</button>
<p style="font-size:13px;opacity:.8">スマホ：画面をドラッグで移動<br>PC：WASD / 矢印キー　攻撃は自動</p></div>
<div class="ov" id="lvl"><h2>レベルアップ！</h2><div id="choices"></div></div>
<div class="ov" id="pz"><h2>ポーズ</h2><button id="bRes">つづける</button><button id="bTitle">タイトルへ</button></div>
<div class="ov" id="dead"><h2 style="color:#f55">やられた…</h2><p>何も失わずにこの階の入口から再挑戦！</p><button id="bRetry">再挑戦</button></div>
<script>
"use strict";
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let VW=180,VH=320,SC=1;
function resize(){const w=innerWidth,h=innerHeight;SC=Math.max(2,Math.floor(Math.min(w,h)/180));VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;cx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
const T=16,$=id=>document.getElementById(id);
// ---------- sprites ----------
function spr(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=rows[y][x];if(k!=='.'){g.fillStyle=pal[k];g.fillRect(x,y,1,1)}}return c}
const S={};
S.hero=spr(["...yyyy...","..yyyyyy..","..ySSSSy..","..SkSSkS..","..SSSSSS..","...bbbb...","..bbrrbb..",".SbbrrbbS.","..bbbbbb..","..bb..bb..","..kk..kk.."],{y:'#e8c040',S:'#f4c8a0',k:'#222',b:'#3060d0',r:'#d03030'});
S.slime=spr(["...gggg...","..gggggg..",".ggwggwgg.",".ggkggkgg.","gggggggggg","gggggggggg",".gggggggg."],{g:'#40c050',w:'#fff',k:'#000'});
S.bat=spr(["p........p","pp.pppp.pp","ppppppppp.",".pprpprpp.","..pppppp..","...p..p..."],{p:'#8040a0',r:'#ff3030'});
S.skel=spr(["..wwww..",".wwwwww.",".wkwwkw.","..wwww..","...ww...",".wwwwww.","w.wwww.w","..w..w..","..w..w.."],{w:'#e8e8e0',k:'#300'});
S.ghost=spr(["..cccc..",".cccccc.","ckcccckc","cccccccc","cccccccc","cccccccc","c.cc.cc."],{c:'#a0e0ff',k:'#203060'});
S.demon=spr(["r......r","rr.rr.rr",".rrrrrr.",".ryrryr.",".rrrrrr.","..rkkr..",".rrrrrr.","rr.rr.rr"],{r:'#c02020',y:'#ff0',k:'#300'});
S.gem=spr([".c.","ccc",".c."],{c:'#40e0ff'});S.gem2=spr([".c.","ccc",".c."],{c:'#50ff60'});S.gem3=spr([".c.","ccc",".c."],{c:'#ff50c0'});
S.heart=spr(["r.r","rrr",".r."],{r:'#ff3050'});
const BOSSES=[
 {n:'キングスライム',s:spr(["....gggggg....","..gggggggggg..",".gggyyggyygg..","ggggkyggkyggg.","gggggggggggggg","ggggrrrrrrgggg","gggggggggggggg",".gggggggggggg."],{g:'#30b040',y:'#ff0',k:'#000',r:'#900'}),sz:3},
 {n:'スケルトンロード',s:spr(["..y.y.y..",".yyyyyyy.","..wwwww..",".wkwwwkw.",".wwwwwww.","..w.w.w..","wwwwwwwww","w.wwwww.w","..w...w..",".ww...ww."],{w:'#ddd',k:'#f00',y:'#fc0'}),sz:3},
 {n:'ドラゴン',s:spr(["g..........g","gg..gggg..gg","ggggggggggg.",".ggyggggyg..",".gggggggggg.","..grrrrrrg..","..gggggggg..",".gg.gggg.gg.","gg........gg"],{g:'#a03030',y:'#ff0',r:'#ff8000'}),sz:3},
 {n:'魔王',s:spr(["p...pppp...p","pp.pppppp.pp",".pppppppppp.",".ppyppppypp.",".pppppppppp.","..pprrrrpp..","pppppppppppp","p.pppppppp.p","..pp....pp.."],{p:'#402060',y:'#f0f',r:'#f00'}),sz:3}];
const ETYPES=[{s:'slime',hp:6,sp:22,dmg:5,xp:1,r:5},{s:'bat',hp:4,sp:40,dmg:4,xp:1,r:5},{s:'skel',hp:12,sp:26,dmg:8,xp:2,r:5},{s:'ghost',hp:10,sp:34,dmg:7,xp:2,r:5},{s:'demon',hp:22,sp:30,dmg:12,xp:3,r:6}];
// tiles
function tile(base,dark,seed){const c=document.createElement('canvas');c.width=c.height=T;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,T,T);let r=seed;for(let i=0;i<14;i++){r=(r*9301+49297)%233280;g.fillStyle=dark;g.fillRect(r%T,(r>>4)%T,1+(i%2),1)}return c}
const THEMES=[['#4a4058','#3a3046','#6a5a3a','#2a2030'],['#3c4a3c','#2c382c','#5a6a4a','#1a241a'],['#584040','#463030','#7a4a3a','#301818'],['#38384a','#28283a','#505080','#18182a']];
let tFloor,tWall,tWallTop;
function mkTiles(f){const th=THEMES[Math.floor((f-1)/5)%4];tFloor=tile(th[0],th[1],f*7+3);tWall=tile(th[2],th[3],f*13+1);const g=tWall.getContext('2d');g.fillStyle=th[3];for(let y=0;y<T;y+=4)g.fillRect(0,y,T,1);for(let y=0;y<T;y+=4)g.fillRect(((y/4)%2)*8,y,1,4)}
// ---------- state ----------
const SAVE='dsurv_save_v1';
let P,map,MW,MH,floor=1,enemies=[],bullets=[],gems=[],fx=[],stairs=null,entrance,bossPhase=0,bossTimer=0,boss=null,state='title',time=0,spawnT=0,kills=0;
const WDEF={
 bolt:{n:'マジックボルト',d:'最も近い敵へ魔法弾を撃つ'},
 whip:{n:'ムチ',d:'左右をなぎ払う'},
 orb:{n:'オービット',d:'周囲を回る光の玉'},
 aura:{n:'聖なるオーラ',d:'周囲の敵に継続ダメージ'},
 axe:{n:'トマホーク',d:'上に投げる重い斧（貫通）'},
 bomb:{n:'ファイアボム',d:'ランダムな場所に爆発'}};
const STATS={might:{n:'ちから',d:'ダメージ+15%'},speed:{n:'すばやさ',d:'移動速度+10%'},maxhp:{n:'タフネス',d:'最大HP+20・全回復'},haste:{n:'クイック',d:'攻撃間隔-8%'},magnet:{n:'マグネット',d:'経験値を引き寄せる範囲+40%'},regen:{n:'リジェネ',d:'HPが毎秒0.5回復'},area:{n:'エリア',d:'攻撃範囲+12%'}};
function newPlayer(){return{x:0,y:0,hp:100,mhp:100,lv:1,xp:0,nx:5,w:{bolt:1},st:{},cd:{},face:1,inv:0,orbA:0}}
function stat(k){return P.st[k]||0}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({floor,P:{hp:P.mhp,mhp:P.mhp,lv:P.lv,xp:P.xp,nx:P.nx,w:P.w,st:P.st}}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}
// ---------- dungeon ----------
function solid(tx,ty){return tx<0||ty<0||tx>=MW||ty>=MH||map[ty*MW+tx]===1}
function genFloor(){
 mkTiles(floor);enemies.length=bullets.length=gems.length=fx.length=0;boss=null;
 const isBoss=floor%5===0;
 if(isBoss){MW=30;MH=30;map=new Uint8Array(MW*MH).fill(1);for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++)map[y*MW+x]=0;
  entrance={x:15*T+8,y:25*T+8};stairs=null;bossPhase=1;bossTimer=300;}
 else{bossPhase=0;MW=60;MH=60;map=new Uint8Array(MW*MH).fill(1);const rooms=[];
  for(let i=0;i<60&&rooms.length<10;i++){const w=6+(Math.random()*8|0),h=6+(Math.random()*8|0),x=2+(Math.random()*(MW-w-4)|0),y=2+(Math.random()*(MH-h-4)|0);
   if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
   for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy*MW+xx]=0}
  for(let i=1;i<rooms.length;i++){const a=rooms[i-1],b=rooms[i];let x=a.cx,y=a.cy;
   while(x!==b.cx){for(let k=0;k<3;k++)map[(y+k-1)*MW+x]=0;x+=Math.sign(b.cx-x)}
   while(y!==b.cy){for(let k=0;k<3;k++)map[y*MW+x+k-1]=0;y+=Math.sign(b.cy-y)}}
  const a=rooms[0];let far=rooms[1],fd=0;for(const r of rooms){const d=Math.hypot(r.cx-a.cx,r.cy-a.cy);if(d>fd){fd=d;far=r}}
  entrance={x:a.cx*T+8,y:a.cy*T+8};stairs={x:far.cx*T+8,y:far.cy*T+8};
  for(const r of rooms){if(r===a)continue;const n=3+floor+(Math.random()*4|0);for(let i=0;i<n;i++)spawnEnemy((r.x+1+Math.random()*(r.w-2))*T,(r.y+1+Math.random()*(r.h-2))*T)}}
 P.x=entrance.x;P.y=entrance.y;P.hp=P.mhp;P.inv=1.5;spawnT=0;time=0;save();
}
function spawnEnemy(x,y,typeIdx){const max=Math.min(ETYPES.length,1+Math.floor((floor+1)/2));const t=ETYPES[typeIdx??(Math.random()*max|0)];const k=1+floor*0.22;
 enemies.push({x,y,t,hp:t.hp*k,mhp:t.hp*k,sp:t.sp*(1+floor*0.015),dmg:t.dmg*(1+floor*0.1),xp:t.xp,r:t.r,hit:0,kx:0,ky:0})}
function spawnBoss(){const tier=Math.floor(floor/5)-1,b=BOSSES[tier%4],lap=Math.floor(tier/4);const hp=(600+tier*700)*(1+lap*2);
 boss={x:15*T+8,y:6*T,t:{s:null},bd:b,hp,mhp:hp,sp:20+tier*3,dmg:20+tier*8,xp:50,r:12+tier,hit:0,kx:0,ky:0,isBoss:1,atk:2,tier};enemies.push(boss);bossPhase=2;
 fx.push({type:'text',x:boss.x,y:boss.y,txt:b.n+' 出現！',life:2.5})}
// ---------- input ----------
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'||e.key==='p')togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let joy=null;
cv.addEventListener('pointerdown',e=>{joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}});
addEventListener('pointerup',e=>{if(joy&&joy.id===e.pointerId)joy=null});addEventListener('pointercancel',()=>joy=null);
// ---------- grid ----------
const GS=32;let grid=new Map();
function buildGrid(){grid.clear();for(const e of enemies){const k=((e.x/GS)|0)*4096+((e.y/GS)|0);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e)}}
function near(x,y,r,cb){const x0=((x-r)/GS)|0,x1=((x+r)/GS)|0,y0=((y-r)/GS)|0,y1=((y+r)/GS)|0;for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const a=grid.get(gx*4096+gy);if(a)for(const e of a)cb(e)}}
// ---------- combat ----------
function dmgMul(){return 1+0.15*stat('might')}
function areaMul(){return 1+0.12*stat('area')}
function hurt(e,d,kx,ky){if(e.hp<=0)return;d*=dmgMul();e.hp-=d;e.hit=0.1;if(!e.isBoss){e.kx+=kx||0;e.ky+=ky||0}
 if(fx.length<150)fx.push({type:'num',x:e.x,y:e.y-6,txt:Math.round(d),life:0.5});
 if(e.hp<=0){kills++;if(e.isBoss){for(let i=0;i<30;i++)gems.push({x:e.x+(Math.random()-.5)*40,y:e.y+(Math.random()-.5)*40,v:5});bossPhase=3;stairs={x:15*T+8,y:15*T+8};boss=null;
   fx.push({type:'text',x:e.x,y:e.y,txt:'撃破！階段が出現',life:3})}
  else{gems.push({x:e.x,y:e.y,v:e.xp});if(Math.random()<0.015)gems.push({x:e.x,y:e.y,heal:1})}}}
function nearestEnemy(r){let best=null,bd=r*r;near(P.x,P.y,r,e=>{const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<bd){bd=d;best=e}});return best}
function fireWeapons(dt){const haste=Math.pow(0.92,stat('haste'));
 for(const k in P.w){const L=P.w[k];P.cd[k]=(P.cd[k]||0)-dt;
  if(k==='orb'){P.orbA+=dt*(2.5+L*0.3);continue}
  if(k==='aura'){if(P.cd[k]<=0){P.cd[k]=0.5;const R=(26+L*5)*areaMul();near(P.x,P.y,R,e=>{if((e.x-P.x)**2+(e.y-P.y)**2<R*R)hurt(e,3+L*2)})}continue}
  if(P.cd[k]>0)continue;
  if(k==='bolt'){P.cd[k]=Math.max(0.15,0.9-L*0.07)*haste;const t=nearestEnemy(160);if(!t){P.cd[k]=0.1;continue}
   const n=1+Math.floor(L/2);for(let i=0;i<n;i++){const a=Math.atan2(t.y-P.y,t.x-P.x)+(i-(n-1)/2)*0.15;bullets.push({k,x:P.x,y:P.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:1.2,d:8+L*3,pierce:L>=5?2:1,r:3})}}
  if(k==='whip'){P.cd[k]=Math.max(0.5,1.4-L*0.1)*haste;const W=(40+L*6)*areaMul(),dirs=L>=3?[1,-1]:[P.face];
   for(const s of dirs){fx.push({type:'whip',x:P.x,y:P.y,s,w:W,life:0.15});near(P.x+s*W/2,P.y,W,e=>{if(Math.abs(e.y-P.y)<12*areaMul()&&(e.x-P.x)*s>-4&&(e.x-P.x)*s<W)hurt(e,12+L*5,s*30,0)})}}
  if(k==='axe'){P.cd[k]=Math.max(0.7,2-L*0.15)*haste;const n=1+Math.floor(L/3);for(let i=0;i<n;i++)bullets.push({k,x:P.x,y:P.y,vx:(Math.random()-.5)*120,vy:-200,g:400,life:2,d:20+L*8,pierce:99,r:6,hitset:new Set(),rot:0})}
  if(k==='bomb'){P.cd[k]=Math.max(0.8,2.5-L*0.2)*haste;const n=1+Math.floor(L/2);for(let i=0;i<n;i++){const t=enemies[(Math.random()*enemies.length)|0];const bx=t&&Math.hypot(t.x-P.x,t.y-P.y)<150?t.x:P.x+(Math.random()-.5)*120,by=t&&Math.hypot(t.x-P.x,t.y-P.y)<150?t.y:P.y+(Math.random()-.5)*160;
   const R=(22+L*3)*areaMul();fx.push({type:'boom',x:bx,y:by,r:R,life:0.3});near(bx,by,R,e=>{if((e.x-bx)**2+(e.y-by)**2<R*R)hurt(e,15+L*6)})}}}
 if(P.w.orb){const L=P.w.orb,n=1+L,R=(28+L*2)*areaMul();P.cd.orbHit=(P.cd.orbHit||0)-dt;if(P.cd.orbHit<=0){P.cd.orbHit=0.25;
  for(let i=0;i<n;i++){const a=P.orbA+i*Math.PI*2/n,ox=P.x+Math.cos(a)*R,oy=P.y+Math.sin(a)*R;near(ox,oy,10,e=>{if((e.x-ox)**2+(e.y-oy)**2<100)hurt(e,6+L*3,Math.cos(a)*20,Math.sin(a)*20)})}}}}
// ---------- level up ----------
function gainXP(v){P.xp+=v;while(P.xp>=P.nx){P.xp-=P.nx;P.lv++;P.nx=Math.floor(5+P.lv*4+P.lv*P.lv*0.3);pendingLv++}}
let pendingLv=0;
function showLevel(){state='lvl';const pool=[];for(const k in WDEF){const L=P.w[k]||0;if(L<8&&(L>0||Object.keys(P.w).length<6))pool.push({k,w:1,L})}for(const k in STATS)if(stat(k)<6)pool.push({k,w:0,L:stat(k)});
 pool.sort(()=>Math.random()-.5);const ch=$('choices');ch.innerHTML='';
 for(const o of pool.slice(0,3)){const b=document.createElement('button');b.className='card';const D=o.w?WDEF[o.k]:STATS[o.k];
  b.innerHTML=`<b>${D.n}</b> ${o.L?'Lv'+(o.L+1):(o.w?'<span style="color:#7f7">NEW</span>':'')}<br>${D.d}${o.w&&o.L?'（強化）':''}`;
  tap(b,()=>{if(o.w)P.w[o.k]=o.L+1;else{P.st[o.k]=o.L+1;if(o.k==='maxhp'){P.mhp+=20;P.hp=P.mhp}}pendingLv--;$('lvl').classList.remove('on');if(pendingLv>0)showLevel();else state='play';save()});ch.appendChild(b)}
 $('lvl').classList.add('on')}
// ---------- update ----------
function moveCirc(o,dx,dy,r){let nx=o.x+dx;if(!solid(((nx+Math.sign(dx)*r)/T)|0,((o.y-r+1)/T)|0)&&!solid(((nx+Math.sign(dx)*r)/T)|0,((o.y+r-1)/T)|0))o.x=nx;
 let ny=o.y+dy;if(!solid(((o.x-r+1)/T)|0,((ny+Math.sign(dy)*r)/T)|0)&&!solid(((o.x+r-1)/T)|0,((ny+Math.sign(dy)*r)/T)|0))o.y=ny}
function update(dt){time+=dt;
 let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(joy){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,l=Math.hypot(dx,dy);if(l>6){const m=Math.min(1,l/50);mx=dx/l*m;my=dy/l*m}}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}const spd=70*(1+0.1*stat('speed'));if(mx)P.face=Math.sign(mx);
 moveCirc(P,mx*spd*dt,my*spd*dt,4);P.moving=ml>0;
 if(stat('regen'))P.hp=Math.min(P.mhp,P.hp+0.5*stat('regen')*dt);P.inv-=dt;
 // boss floor
 if(bossPhase===1){bossTimer-=dt;spawnT-=dt;const rate=Math.max(0.12,0.6-(300-bossTimer)/300*0.4-floor*0.01);
  if(spawnT<=0&&enemies.length<350){spawnT=rate;const n=1+Math.floor((300-bossTimer)/60);for(let i=0;i<n;i++){const a=Math.random()*6.28,d=VW/2+40;let x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;x=Math.max(3*T,Math.min((MW-3)*T,x));y=Math.max(3*T,Math.min((MH-3)*T,y));spawnEnemy(x,y)}}
  if(bossTimer<=0){bossTimer=0;spawnBoss()}}
 else if(bossPhase===2){spawnT-=dt;if(spawnT<=0&&enemies.length<120){spawnT=1.2;const a=Math.random()*6.28;spawnEnemy(Math.max(3*T,Math.min((MW-3)*T,P.x+Math.cos(a)*150)),Math.max(3*T,Math.min((MH-3)*T,P.y+Math.sin(a)*150)))}}
 else if(bossPhase===0){spawnT-=dt;if(spawnT<=0&&enemies.length<80){spawnT=Math.max(1,4-floor*0.1);for(let i=0;i<3;i++){const a=Math.random()*6.28,x=P.x+Math.cos(a)*170,y=P.y+Math.sin(a)*170;if(!solid((x/T)|0,(y/T)|0))spawnEnemy(x,y)}}}
 buildGrid();fireWeapons(dt);
 // enemies
 for(const e of enemies){const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;e.hit-=dt;
  if(d>400&&!e.isBoss)continue;
  let vx=dx/d*e.sp,vy=dy/d*e.sp;
  if(e.isBoss){e.atk-=dt;if(e.atk<=0){e.atk=Math.max(0.8,2.2-e.tier*0.2);const n=8+e.tier*3,off=Math.random();for(let i=0;i<n;i++){const a=off+i*6.283/n;bullets.push({k:'eb',x:e.x,y:e.y,vx:Math.cos(a)*(60+e.tier*8),vy:Math.sin(a)*(60+e.tier*8),life:4,d:e.dmg*0.5,r:3,enemy:1})}}}
  // separation
  near(e.x,e.y,10,o=>{if(o!==e){const sx=e.x-o.x,sy=e.y-o.y,sd=sx*sx+sy*sy;if(sd<64&&sd>0.01){const s=1/Math.sqrt(sd);vx+=sx*s*25;vy+=sy*s*25}}});
  vx+=e.kx*8;vy+=e.ky*8;e.kx*=0.85;e.ky*=0.85;
  if(e.isBoss){e.x+=vx*dt;e.y+=vy*dt;e.x=Math.max(3*T,Math.min((MW-3)*T,e.x));e.y=Math.max(3*T,Math.min((MH-3)*T,e.y))}else moveCirc(e,vx*dt,vy*dt,3);
  if(d<e.r+4&&P.inv<=0){P.hp-=e.dmg;P.inv=0.5;fx.push({type:'flash',life:0.15})}}
 for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){enemies[i]=enemies[enemies.length-1];enemies.pop()}
 // bullets
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.life-=dt;if(b.g)b.vy+=b.g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.rot!==undefined)b.rot+=dt*12;
  if(b.enemy){if((b.x-P.x)**2+(b.y-P.y)**2<36&&P.inv<=0){P.hp-=b.d;P.inv=0.5;b.life=0}}
  else{if(b.k==='bolt'&&solid((b.x/T)|0,(b.y/T)|0))b.life=0;
   near(b.x,b.y,b.r+12,e=>{if(b.life<=0||e.hp<=0)return;if((e.x-b.x)**2+(e.y-b.y)**2<(b.r+e.r)**2){if(b.hitset){if(b.hitset.has(e))return;b.hitset.add(e)}hurt(e,b.d,b.vx*0.05,b.vy*0.05);if(--b.pierce<=0)b.life=0}})}
  if(b.life<=0){bullets[i]=bullets[bullets.length-1];bullets.pop()}}
 // gems
 const mag=(24*(1+0.4*stat('magnet')))**2;
 for(let i=gems.length-1;i>=0;i--){const g=gems[i],dx=P.x-g.x,dy=P.y-g.y,d2=dx*dx+dy*dy;if(d2<mag||g.pull){g.pull=1;const d=Math.sqrt(d2)||1;g.x+=dx/d*200*dt;g.y+=dy/d*200*dt}
  if(d2<64){if(g.heal)P.hp=Math.min(P.mhp,P.hp+30);else gainXP(g.v);gems[i]=gems[gems.length-1];gems.pop()}}
 if(gems.length>400){let s=0;for(const g of gems.splice(0,100))s+=g.v||0;gems.push({x:P.x+20,y:P.y,v:s})}
 for(let i=fx.length-1;i>=0;i--){fx[i].life-=dt;if(fx[i].life<=0)fx.splice(i,1)}
 // stairs
 if(stairs&&Math.hypot(P.x-stairs.x,P.y-stairs.y)<10){floor++;genFloor();fx.push({type:'text',x:P.x,y:P.y-20,txt:'B'+floor+'F'+(floor%5===0?' ボスフロア！':''),life:2.5})}
 if(P.hp<=0){P.hp=0;state='dead';$('dead').classList.add('on');$('pause').style.display='none'}
 if(pendingLv>0&&state==='play')showLevel();
}
// ---------- render ----------
function draw(){const camX=Math.round(P.x-VW/2),camY=Math.round(P.y-VH/2);cx.fillStyle='#000';cx.fillRect(0,0,VW,VH);
 const x0=Math.max(0,(camX/T)|0),y0=Math.max(0,(camY/T)|0),x1=Math.min(MW-1,((camX+VW)/T)|0),y1=Math.min(MH-1,((camY+VH)/T)|0);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const w=map[y*MW+x];if(w){if(y+1<MH&&!map[(y+1)*MW+x])cx.drawImage(tWall,x*T-camX,y*T-camY)}else cx.drawImage(tFloor,x*T-camX,y*T-camY)}
 if(stairs){const sx=stairs.x-camX-8,sy=stairs.y-camY-8;cx.fillStyle='#000';cx.fillRect(sx,sy,16,16);cx.fillStyle='#aaa';for(let i=0;i<4;i++)cx.fillRect(sx+i*2,sy+i*4,16-i*4,2);
  if(Math.abs(stairs.x-P.x)>VW/2||Math.abs(stairs.y-P.y)>VH/2){const a=Math.atan2(stairs.y-P.y,stairs.x-P.x);cx.fillStyle='#ff0';cx.fillRect(VW/2+Math.cos(a)*40-2,VH/2+Math.sin(a)*40-2,4,4)}}
 for(const g of gems){const s=g.heal?S.heart:g.v>=5?S.gem3:g.v>=2?S.gem2:S.gem;cx.drawImage(s,(g.x-camX-1)|0,(g.y-camY-1)|0)}
 if(P.w.aura){const R=(26+P.w.aura*5)*areaMul();cx.fillStyle='rgba(255,240,120,'+(0.12+0.05*Math.sin(time*6))+')';cx.beginPath();cx.arc(P.x-camX,P.y-camY,R,0,7);cx.fill()}
 for(const e of enemies){const ex=e.x-camX,ey=e.y-camY;if(ex<-40||ey<-40||ex>VW+40||ey>VH+40)continue;
  if(e.isBoss){const im=e.bd.s,sc=e.bd.sz;cx.drawImage(im,(ex-im.width*sc/2)|0,(ey-im.height*sc/2)|0,im.width*sc,im.height*sc);if(e.hit>0){cx.fillStyle='rgba(255,255,255,.5)';cx.fillRect(ex-im.width*sc/2,ey-im.height*sc/2,im.width*sc,im.height*sc)}}
  else{const im=S[e.t.s];const bob=(Math.sin(time*8+e.x)*1)|0;cx.drawImage(im,(ex-im.width/2)|0,(ey-im.height/2+bob)|0);if(e.hit>0){cx.fillStyle='rgba(255,255,255,.6)';cx.fillRect((ex-im.width/2)|0,(ey-im.height/2+bob)|0,im.width,im.height)}}}
 // player
 if(P.inv<=0||((time*20)|0)%2){cx.save();cx.translate((P.x-camX)|0,(P.y-camY)|0);if(P.face<0)cx.scale(-1,1);cx.drawImage(S.hero,-5,-6-(P.moving?(((time*10)|0)%2):0));cx.restore()}
 if(P.w.orb){const L=P.w.orb,n=1+L,R=(28+L*2)*areaMul();cx.fillStyle='#8ff';for(let i=0;i<n;i++){const a=P.orbA+i*Math.PI*2/n;cx.fillRect((P.x+Math.cos(a)*R-camX-2)|0,(P.y+Math.sin(a)*R-camY-2)|0,4,4)}}
 for(const b of bullets){const bx=(b.x-camX)|0,by=(b.y-camY)|0;if(b.enemy){cx.fillStyle='#f4f';cx.fillRect(bx-2,by-2,4,4)}else if(b.k==='bolt'){cx.fillStyle='#fff';cx.fillRect(bx-1,by-1,3,3);cx.fillStyle='#6cf';cx.fillRect(bx-2,by,1,1)}
  else{cx.save();cx.translate(bx,by);cx.rotate(b.rot);cx.fillStyle='#aaa';cx.fillRect(-4,-1,8,2);cx.fillStyle='#ddd';cx.fillRect(2,-4,3,6);cx.restore()}}
 cx.textAlign='center';cx.font='8px monospace';
 for(const f of fx){if(f.type==='whip'){cx.fillStyle='rgba(255,255,255,'+f.life*5+')';const x=f.s>0?P.x-camX:P.x-camX-f.w;cx.fillRect(x,P.y-camY-3,f.w,4)}
  else if(f.type==='boom'){cx.fillStyle='rgba(255,140,30,'+f.life*2.5+')';cx.beginPath();cx.arc(f.x-camX,f.y-camY,f.r*(1.2-f.life),0,7);cx.fill()}
  else if(f.type==='num'){cx.fillStyle='#fff';cx.fillText(f.txt,f.x-camX,f.y-camY-(0.5-f.life)*20)}
  else if(f.type==='text'){cx.font='bold 10px sans-serif';cx.fillStyle='#000';cx.fillText(f.txt,VW/2+1,VH/3+1);cx.fillStyle='#ffd84a';cx.fillText(f.txt,VW/2,VH/3);cx.font='8px monospace'}
  else if(f.type==='flash'){cx.fillStyle='rgba(255,0,0,.25)';cx.fillRect(0,0,VW,VH)}}
 // joystick
 if(joy){const sx=joy.sx/SC,sy=joy.sy/SC;let dx=(joy.x-joy.sx)/SC,dy=(joy.y-joy.sy)/SC;const l=Math.hypot(dx,dy),m=50/SC;if(l>m){dx*=m/l;dy*=m/l}
  cx.strokeStyle='rgba(255,255,255,.4)';cx.beginPath();cx.arc(sx,sy,m,0,7);cx.stroke();cx.fillStyle='rgba(255,255,255,.4)';cx.beginPath();cx.arc(sx+dx,sy+dy,m/2.5,0,7);cx.fill()}
 // HUD
 cx.textAlign='left';cx.fillStyle='#222';cx.fillRect(0,0,VW,4);cx.fillStyle='#4af';cx.fillRect(0,0,VW*P.xp/P.nx,4);
 cx.fillStyle='#400';cx.fillRect(4,8,60,6);cx.fillStyle='#e33';cx.fillRect(4,8,60*P.hp/P.mhp,6);
 cx.font='8px monospace';cx.fillStyle='#fff';cx.fillText('HP '+Math.ceil(P.hp)+'/'+P.mhp,4,23);cx.fillText('Lv'+P.lv+'  B'+floor+'F',4,32);
 cx.textAlign='center';
 if(bossPhase===1){const m=Math.floor(bossTimer/60),s=Math.floor(bossTimer%60);cx.font='bold 12px monospace';cx.fillStyle='#f66';cx.fillText('ボス出現まで '+m+':'+String(s).padStart(2,'0'),VW/2,48)}
 else if(boss){cx.fillStyle='#300';cx.fillRect(10,42,VW-20,6);cx.fillStyle='#c0f';cx.fillRect(10,42,(VW-20)*boss.hp/boss.mhp,6);cx.fillStyle='#fff';cx.fillText(boss.bd.n,VW/2,58)}
 else{const t=Math.floor(time);cx.fillStyle='#ccc';cx.fillText(Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),VW/2,14)}
 if(bossPhase===3)cx.fillText('中央の階段へ進もう！',VW/2,48);
}
// ---------- loop ----------
let last=performance.now();
function loop(now){let dt=Math.min(0.05,(now-last)/1000);last=now;if(state==='play')update(dt);if(P&&map)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function startGame(cont){if(state==='play')return;const s=cont&&load();P=newPlayer();floor=1;if(s){floor=s.floor;Object.assign(P,s.P)}pendingLv=0;genFloor();
 fx.push({type:'text',x:0,y:0,txt:'B'+floor+'F'+(floor%5===0?' ボスフロア！5分耐えろ！':''),life:2.5});
 $('title').classList.remove('on');$('pause').style.display='block';state='play';last=performance.now()}
function tap(el,fn){let t=0;const h=e=>{const n=Date.now();if(n-t<400)return;t=n;try{fn()}catch(err){console.error(err)}};el.addEventListener('click',h);el.addEventListener('touchend',h,{passive:true})}
tap($('bNew'),()=>startGame(false));tap($('bCont'),()=>startGame(true));if(!load())$('bCont').style.display='none';
function togglePause(){if(state==='play'){state='pause';$('pz').classList.add('on')}else if(state==='pause'){state='play';$('pz').classList.remove('on');last=performance.now()}}
tap($('pause'),togglePause);tap($('bRes'),togglePause);
tap($('bTitle'),()=>{save();$('pz').classList.remove('on');$('pause').style.display='none';state='title';$('bCont').style.display='';$('title').classList.add('on')});
tap($('bRetry'),()=>{$('dead').classList.remove('on');genFloor();fx.push({type:'text',x:0,y:0,txt:'B'+floor+'F 再挑戦！',life:2});$('pause').style.display='block';state='play'});
window.__dbg={get P(){return P},get enemies(){return enemies},setFloor(f){floor=f;genFloor()},get state(){return state}};
</script></body></html>
